<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web application to create Minecraft map art from any image. Hosted on GitHub: https://github.com/zinngar/Instamapart">
    <title>Minecraft Map Art Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Minecraft Map Art Maker</h1>
    <div class="container">
    <input type="file" id="imageLoader" name="imageLoader" accept="image/*" hidden>
    <label for="imageLoader" id="uploadButton" class="button">Upload Image</label>
        <canvas id="canvas"></canvas>
        <div id="settings">
            <label for="mapSize">Map Size:</label>
            <select id="mapSize">
                <option value="1">1x1</option>
                <option value="2">2x2</option>
                <option value="3">3x3</option>
            </select>
            <div class="palette-option">
                <label for="blockPalette">Block Palette:</label>
                <select id="blockPalette">
                    <option value="all">All Blocks</option>
                    <option value="wool">Wool Only</option>
                    <option value="concrete">Concrete Only</option>
                    <option value="no_expensive">No Expensive Blocks</option>
                </select>
            </div>
        </div>
        <button id="generate" class="button">Generate Schematic</button>
        <a id="download" style="display: none;">Download Schematic</a>
    </div>
    <footer style="margin-top: 2rem; text-align: center;">
        <p>Source code available on <a href="https://github.com/zinngar/Instamapart">GitHub</a></p>
    </footer>
    <script src="js/script.js" type="module"></script>
</body>
</html>
